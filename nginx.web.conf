server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Rotas do Expo Router caem no index.html.
  location / {
    try_files $uri $uri.html /index.html;
  }

  # O index.html aponta para os arquivos da versão atual: o navegador sempre confere se mudou,
  # para ninguém ficar preso numa versão antiga depois de uma atualização.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
