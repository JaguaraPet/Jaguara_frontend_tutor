<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Jaguara</title>
    <meta name="description" content="A vida do seu pet num lugar só: vacinas, remédios, rotina e agendamentos." />
    <!-- "Adicionar à tela de início" no iPhone e no Android: abre em tela cheia, como um app instalado. -->
    <meta name="theme-color" content="#8A4B0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jaguara" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /*
       * No computador, o app abre dentro de um celular no meio da tela, em vez de esticado.
       * No celular (e no app instalado) nada disso vale: ele ocupa a tela inteira.
       */
      @media (min-width: 768px) and (min-height: 640px) {
        body {
          margin: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background:
            radial-gradient(900px 520px at 0% 0%, rgb(31 92 74 / 22%), transparent 60%),
            radial-gradient(800px 480px at 100% 100%, rgb(138 75 15 / 20%), transparent 60%),
            #f3ebd6;
          font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        #root {
          flex: none;
          width: 390px;
          height: min(844px, calc(100vh - 88px));
          border: 10px solid #1e1b18;
          border-radius: 48px;
          overflow: hidden;
          background: #ffffff;
          box-shadow:
            0 0 0 1px rgb(30 27 24 / 30%),
            0 30px 80px rgb(30 27 24 / 28%);
          /* Faz o que é "fixo na tela" (botões flutuantes, avisos) ficar dentro do celular. */
          transform: translateZ(0);
        }
        body::after {
          content: 'Versão para celular. No seu telefone, o Jaguara abre em tela cheia.';
          font-size: 13px;
          color: #5c554e;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o Jaguara.</noscript>
    <div id="root"></div>
    <script>
      // No computador, clicar e arrastar rola a tela e os carrosséis como o dedo no celular.
      // Só para o mouse: toque e caneta seguem o comportamento normal do navegador.
      (function () {
        var LIMIAR = 6;
        var arrasto = null;
        function rolavel(el) {
          for (; el && el !== document.body; el = el.parentElement) {
            var estilo = getComputedStyle(el);
            var y = /(auto|scroll)/.test(estilo.overflowY) && el.scrollHeight > el.clientHeight;
            var x = /(auto|scroll)/.test(estilo.overflowX) && el.scrollWidth > el.clientWidth;
            if (x || y) return { el: el, x: x, y: y };
          }
          return null;
        }
        document.addEventListener('pointerdown', function (e) {
          if (e.pointerType !== 'mouse' || e.button !== 0) return;
          if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
          var alvo = rolavel(e.target);
          if (!alvo) return;
          arrasto = { alvo: alvo, x: e.clientX, y: e.clientY, esquerda: alvo.el.scrollLeft, topo: alvo.el.scrollTop, moveu: false };
        });
        document.addEventListener('pointermove', function (e) {
          if (!arrasto) return;
          var dx = e.clientX - arrasto.x;
          var dy = e.clientY - arrasto.y;
          if (!arrasto.moveu && Math.abs(dx) < LIMIAR && Math.abs(dy) < LIMIAR) return;
          arrasto.moveu = true;
          document.body.style.userSelect = 'none';
          if (arrasto.alvo.x) arrasto.alvo.el.scrollLeft = arrasto.esquerda - dx;
          if (arrasto.alvo.y) arrasto.alvo.el.scrollTop = arrasto.topo - dy;
        });
        document.addEventListener('pointerup', function () {
          if (!arrasto) return;
          var moveu = arrasto.moveu;
          arrasto = null;
          document.body.style.userSelect = '';
          if (!moveu) return;
          // Um arrasto não vale como toque no botão onde o mouse foi solto.
          var cancelar = function (ev) {
            ev.stopPropagation();
            ev.preventDefault();
          };
          window.addEventListener('click', cancelar, true);
          setTimeout(function () {
            window.removeEventListener('click', cancelar, true);
          }, 0);
        });
      })();
    </script>
  </body>
</html>
